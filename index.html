<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Some awesome game</title>
        <style>
            @font-face {
                font-family: Bungee;
                src: url('./assets/fonts/Bungee-Regular.ttf');
            }

            html {
                font-family: Bungee;
            }

            body {
                background: url('./assets/images/bg2.jpg');
            }
        </style>
    </head>
    <body>
        <div class="info" id="info">
            <p id="score">Score: 0</p>
            <p id="level">Level: 1</p>
            <p id="credits">Credits: 0</p>
            <div class="hud-bar-row">
                <span class="hud-bar-label">Hull</span>
                <div class="hud-bar hull"><div id="hullBar" class="hud-bar-fill"></div></div>
                <span id="hullText" class="hud-bar-text"></span>
            </div>
            <div class="hud-bar-row" id="shieldRow">
                <span class="hud-bar-label">Shield</span>
                <div class="hud-bar shield"><div id="shieldBar" class="hud-bar-fill"></div></div>
                <span id="shieldText" class="hud-bar-text"></span>
            </div>
            <p id="targeting"></p>
            <p id="fps">Fps: 0</p>
        </div>
        <div id="menu" class="menu">
            <h1>Awesome game</h1>
            <p id="menuMessage" class="menu-message"></p>
            <p id="menuCredits" class="menu-credits"></p>
            <h2 id="startGame" class="menu-action">Start shooting</h2>
            <h2 id="openShipyard" class="menu-action">Shipyard</h2>
            <hr>
            <h4>Thrust: W / S &nbsp; Rotate: A / D &nbsp; Strafe: Q / E &nbsp; Stabilize: X</h4>
            <h4>Aim: mouse &nbsp; Guns: left click / SPACE &nbsp; Missiles: right click / F</h4>
            <h4>Auto-targeting: G &nbsp; Pause: ESC</h4>
        </div>
        <div id="pauseMenu" class="menu pause-menu">
            <h1>Paused</h1>
            <h2 id="resumeGame" class="menu-action">Resume</h2>
            <h2 id="pauseShipyard" class="menu-action">Shipyard</h2>
            <h2 id="abandonGame" class="menu-action">Abandon run</h2>
        </div>
        <div class="gameboard" id="gameboard">
        </div>
        <script src="./dist/bundle.js"></script>
    </body>
</html>
