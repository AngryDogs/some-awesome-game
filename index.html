<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Some awesome game</title>
        <style>
            @font-face {
                font-family: Bungee;
                src: url('./assets/fonts/Bungee-Regular.ttf');
            }

            html {
                font-family: Bungee;
            }

            body {
                background: url('./assets/images/bg2.jpg');
            }
        </style>
    </head>
    <body>
        <div class="info" id="info">
            <p id="score">Score: 0</p>
            <p id="level">Level: 1</p>
            <p id="health">Lives: 3</p>
            <p id="fps">Fps: 0</p>
        </div>
        <div id="menu" class="menu">
            <h1>Awesome game</h1>
            <p id="menuMessage" class="menu-message"></p>
            <h2 id="startGame">Start shooting</h2>
            <hr>
            <h4>Thrust: W / S &nbsp; Rotate: A / D &nbsp; Strafe: Q / E</h4>
            <h4>Stabilize: X</h4>
            <h4>Aim: mouse &nbsp; Shoot: left click or SPACE</h4>
        </div>
        <div class="gameboard" id="gameboard">
        </div>
        <script src="./dist/bundle.js"></script>
    </body>
</html>
