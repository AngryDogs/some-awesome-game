name: Native game

on:
  push:
    branches: [claude/native-game]
    paths: ["native/**", ".github/workflows/native-game.yml"]
    tags: ["native-v*"]
  workflow_dispatch:

jobs:
  macos:
    name: macOS universal app
    runs-on: macos-14
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build universal .app
        run: ./tools/bundle-macos.sh
      - name: Zip
        run: cd target/macos && ditto -c -k --keepParent "Some Awesome Game.app" SomeAwesomeGame-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SomeAwesomeGame-macos
          path: native/target/macos/SomeAwesomeGame-macos.zip

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist/SomeAwesomeGame
          cp target/release/some-awesome-game dist/SomeAwesomeGame/
          cp README.md assets/sounds/CREDITS.txt dist/SomeAwesomeGame/
          cp assets/models/CREDITS.txt dist/SomeAwesomeGame/MODEL-CREDITS.txt
          tar -C dist -czf SomeAwesomeGame-linux-x86_64.tar.gz SomeAwesomeGame
      - uses: actions/upload-artifact@v4
        with:
          name: SomeAwesomeGame-linux
          path: native/SomeAwesomeGame-linux-x86_64.tar.gz
