[package]
name = "some-awesome-game"
version = "0.1.0"
edition = "2021"
description = "Stargate-themed 3D space mining and combat game (native, GPU accelerated)"

[dependencies]
# Bevy renders with wgpu: Metal on macOS, Vulkan on Linux.
bevy = { version = "0.16", default-features = false, features = [
    "std", "bevy_asset", "bevy_audio", "bevy_color", "bevy_core_pipeline", "bevy_gizmos", "bevy_pbr",
    "bevy_render", "bevy_state", "bevy_text", "bevy_ui", "bevy_window", "bevy_winit", "bevy_log",
    "default_font", "hdr", "multi_threaded", "tonemapping_luts", "ktx2", "zstd", "smaa_luts",
    "mp3", "wav", "x11", "wayland", "sysinfo_plugin", "png"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
earcutr = "0.4"
rand = "0.8"
dirs = "5"

# Fast enough to play in debug builds; dependencies fully optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
